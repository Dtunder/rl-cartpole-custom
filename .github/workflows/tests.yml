name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-smoke-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy gymnasium matplotlib pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Run evaluation smoke test
        run: python evaluate.py --smoke --output-dir .ci-results
